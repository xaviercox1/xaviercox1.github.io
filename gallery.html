<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Xavier Cox</title>
  <meta name="description" content="Selected moving image, motion design, photography and visual experiments by Xavier Cox." />
  <link rel="canonical" href="https://xaviercox.au/gallery.html" />
  <link rel="icon" href="favicon.png" />
  <link rel="preload" href="Content/Fonts/RobotoFlex-Variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="assets/css/base.css?v=20261031-publish" />
  <link rel="stylesheet" href="assets/css/home.css?v=20261111-archive-motion-v8" />
  <link rel="stylesheet" href="assets/css/gallery.css?v=20261031-publish" />
</head>
<body class="gallery-redesign-page">
  <div class="cursor-blur" aria-hidden="true"></div>
  <div class="cursor-dot" aria-hidden="true"></div>
  <nav class="workshop-nav" aria-label="Gallery navigation">
    <a href="journal.html" class="workshop-nav__item width-wave" data-width-wave data-wave-origin="left">JOURNAL</a>
    <span class="gallery-jeff-slot">
      <button type="button" class="jeff-home gallery-jeff gallery-jeff--top" aria-label="Jeff · return to homepage">
        <span class="jeff-home__motion" aria-hidden="true"><span class="jeff-home__square"></span></span>
      </button>
    </span>
    <a href="index.html#about" class="workshop-nav__item width-wave" data-width-wave data-wave-origin="right">ABOUT</a>
  </nav>
  <button type="button" class="jeff-home gallery-jeff gallery-jeff--edge" aria-label="Jeff · return to homepage" aria-hidden="true" tabindex="-1" inert>
    <span class="jeff-home__motion" aria-hidden="true"><span class="jeff-home__square"></span></span>
  </button>
  <main class="grid-main" aria-label="Selected work">
    <div class="portfolio-grid" id="portfolio-grid"></div>
    <noscript>Enable JavaScript to explore this gallery.</noscript>
  </main>
  <aside class="grid-controls" id="grid-controls" aria-label="Gallery layout controls" hidden>
    <div class="grid-controls__heading"><h1>GRID SETTINGS</h1><button type="button" id="grid-controls-close" aria-label="Hide grid settings">×</button></div>
    <p>Changes update live. Copy your values when it feels right.</p>
    <div id="grid-fields"></div>
    <label class="grid-checkbox"><input id="grid-titles" type="checkbox" /> Show titles</label>
    <label class="grid-seed">Shuffle seed <input id="grid-seed" type="number" min="1" max="999999" step="1" /></label>
    <div class="grid-controls__actions"><button id="grid-shuffle" type="button">RESHUFFLE</button><button id="grid-reset" type="button">RESET</button></div>
    <label class="grid-values-label" for="grid-values">Your settings</label>
    <textarea id="grid-values" readonly spellcheck="false" aria-label="Gallery settings JSON"></textarea>
    <button id="grid-copy" type="button">COPY SETTINGS</button>
    <span id="grid-copy-status" role="status" aria-live="polite"></span>
  </aside>
  <dialog class="grid-viewer" id="grid-viewer" aria-labelledby="grid-viewer-title">
    <button class="grid-viewer__close" id="grid-viewer-close" type="button" aria-label="Close work">×</button>
    <div class="grid-viewer__media" id="grid-viewer-media"></div>
    <h2 id="grid-viewer-title"></h2>
    <p id="grid-viewer-status" role="status"></p>
  </dialog>
  <script defer src="assets/js/gallery-data.js?v=20261111-earth-tones"></script>
  <script defer src="assets/js/cursor.js?v=20261031-publish"></script>
  <script defer src="assets/js/typography.js?v=20261031-publish"></script>
  <script defer src="assets/js/gallery.js?v=20261111-earth-tones"></script>
  <script defer src="assets/js/page-jeff.js?v=20261031-publish"></script>
</body>
</html>

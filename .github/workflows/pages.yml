name: Publish static portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Check JavaScript syntax
        run: |
          for source in assets/js/*.js; do
            node --check "$source"
          done
      - name: Prepare and size-check the website
        run: python3 scripts/build-pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
